name: golang-pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version: '>=1.19.5'
          cache: true
      - name: Install Poppler utils (pdftoppm)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      -
        name: Run unit tests
        env:
          RMQ_GOLDEN_WORKDIR: ${{ runner.temp }}/rmq-golden-artifacts
        run: go test ./... -count=1
      - name: Upload golden diff artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rmq-golden-artifacts
          path: ${{ runner.temp }}/rmq-golden-artifacts
          if-no-files-found: ignore
