title: ":wrench: fix(rmcloud): bump rmapi fork to sort root index by document ID (fixes #23)"
description: |
  All reMarkable cloud writes failed with HTTP 400 "invalid root schema" since
  2026-08-17 (issue #23). Root cause: the pinned rmapi fork
  (github.com/marcobarcelos/rmapi) serializes the root index (root.docSchema)
  in raw slice order via HashTree.IndexReader(); the cloud now requires
  entries strictly sorted by document ID. Two mutators break the order and
  only re-hash: HashTree.Add() appends, HashTree.Remove() swap-deletes.
  Reads kept working because HashTree.Mirror() sorts t.Docs on the read path.

  Fix: repoint the go.mod replace directive from marcobarcelos/rmapi
  (pre-fix, 2026-05-18) to FNStudios-NI/rmapi@f295d5466978, the head of
  ddvk/rmapi#77 ("fix: sort root index by document ID before serializing").
  That commit adds sort.Slice(t.Docs, ...) in HashTree.IndexReader() and
  sort.Slice(d.Files, ...) in BlobDoc.IndexReaderWithSchema() at the single
  serialization point, keeping the uploaded body and the Rehash()-derived
  root hash consistent by construction. Both forks declare
  `module github.com/juruen/rmapi`, so this is a drop-in dependency bump
  with no application code change; the v4-always-emit behavior remarquee
  relies on is preserved (it lives in upstream ddvk, not marcobarcelos).

  Pinned by exact pseudo-version (immutable commit SHA) rather than branch
  name for reproducibility. TODO(#23): once ddvk/rmapi#77 merges to ddvk
  master, re-point the replace at the merge commit (or a ddvk tag) so we
  track upstream.

  No remarquee application code changed.

commands:
  - go mod edit -replace=...=github.com/FNStudios-NI/rmapi@v0.0.0-20260817154736-f295d5466978
  - go mod tidy
  - go build -o remarquee ./cmd/remarquee

tests:
  - go vet ./pkg/rmcloud/... ./cmd/remarquee/cmds/cloud/... ./cmd/remarquee/cmds/upload/... — PASS
  - go test ./pkg/rmcloud/... ./cmd/remarquee/cmds/upload/... — PASS (pkg/rmcloud ok, upload ok)
  - manual live (exact issue #23 repro): `remarquee cloud mkdir /ai/2026/08/17 --non-interactive` — was 400 "invalid root schema", now exit 0 (dir created)
  - manual live: second Add in same session `cloud mkdir /ai/2026/08/17/rmq-0023-probe` — exit 0
  - manual live: Remove (swap-delete path) `cloud rm .../rmq-0023-probe --yes` — exit 0
  - manual live: cleanup `cloud rm /ai/2026/08/17 --yes` — exit 0; read confirms no trace
  - verified sort.Slice present in pinned source: api/sync15/tree.go:178 (t.Docs), api/sync15/blobdoc.go:117 (d.Files)
  - verified v4-always-emit behavior preserved in pinned source: api/sync15/tree.go:157

files_changed:
  - go.mod  (replace directive: marcobarcelos/rmapi -> FNStudios-NI/rmapi@f295d5466978)
  - go.sum  (corresponding hash updates)
