title: "✨ feat(RMQ-0021): --annotations-only for rmdoc render-v6 and render-v6-png"
description: |
  Adds annotations-only V6 rendering with render-legacy parity across 4 phases.
  New CLI flags:
    - remarquee rmdoc render-v6 --annotations-only [--pages ...]: blank-page
      annotations-only PDF (strokes, smart highlights, typed text); unannotated
      pages skipped unless explicitly selected (then emitted blank); default
      output <input>-v6-annotations.pdf; glaze row gains annotations_only
    - remarquee rmdoc render-v6-png --annotations-only: same content as PNGs,
      1:1 page mapping, <base>-v6-annotations prefix
  New library API: render.RenderRMDocV6AnnotationsOnlyWithInfo(ctx, path,
  V6MergeOptions, pageIndices, includeUnannotated).
  DR-6: annotations-only PDF is written by a minimal stdlib-only writer
  (pkg/rmdoc/render/v6_annotations_only_pdf.go) - no unipdf in this path,
  no AGPL watermark, no go:linkname license hack.
tests:
  - name: go test ./... -count=1
    result: pass (zero failures incl. cmd/remarquee-ui via gitignored placeholder dist)
  - name: 6 library unit tests (fixtures) + 4 CLI tests
    result: pass
  - name: byte-identical refactor check (MD5 before/after Phase 1)
    result: pass (workbook --pages 1-3 + full cpage-pdf.rmdoc)
  - name: end-to-end TTC Garden workbook via --cloud
    result: pass (3 pages; bare flag on 44-page doc also 3 pages; 0 watermarks; qpdf --check clean)
