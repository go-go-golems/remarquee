                - { x: -500, y: 200 }
                - { x:  500, y: 200 }
        - name: "layer-2"
          items:
            - kind: stroke
              stroke:
                tool: fineliner_2
                color: red
                width: 1
              points:
                - { x: -500, y: 400 }
                - { x:  500, y: 400 }
