rm_dsl: v0
document:
  name: "rmq-0009-two-pages-mixed"
  kind: notebook
  format: v6
  pages:
    - id: "p1"
      canvas:
        space: rm_screen_v6
        width: 1404
        height: 1872
      layers:
        - name: "layer-1"
          items:
            - kind: stroke
              stroke:
                tool: fineliner_2
                color: black
                width: 1
              points:
                - { x: -500, y: 200 }
                - { x:  500, y: 200 }
    - id: "p2"
      canvas:
        space: rm_screen_v6
        width: 1404
        height: 1872
      layers:
        - name: "layer-1"
          items:
            - kind: shape
              shape: rect
              stroke:
                tool: fineliner_2
                color: black
                width: 1
              rect: { x: -300, y: 300, w: 600, h: 400 }
              rotate_deg: 0
